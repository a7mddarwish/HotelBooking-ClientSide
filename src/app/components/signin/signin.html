<section class="signin-section py-5 bg-light">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <h2 class="fw-bold mb-2">Welcome Back</h2>
              <p class="text-muted">Sign in to your account</p>
            </div>

            <form (ngSubmit)="onSubmit()">
              <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <input 
                  type="email" 
                  [(ngModel)]="email" 
                  name="email" 
                  class="form-control form-control-lg" 
                  placeholder="Enter your email"
                  required>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input 
                  type="password" 
                  [(ngModel)]="password" 
                  name="password" 
                  class="form-control form-control-lg" 
                  placeholder="Enter your password"
                  required>
              </div>

              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="remember">
                  <label class="form-check-label" for="remember">
                    Remember me
                  </label>
                </div>
                <a href="#" class="text-warning text-decoration-none">Forgot password?</a>
              </div>

              <button type="submit" class="btn btn-warning btn-lg w-100 text-white fw-semibold mb-3">
                Sign In
              </button>

              <p class="text-center text-muted mb-0">
                Don't have an account? 
                <a routerLink="/signup" class="text-warning text-decoration-none fw-semibold">Sign Up</a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
