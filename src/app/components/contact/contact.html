<section class="contact-section py-5 bg-light">
  <div class="container">
    <!-- Header -->
    <div class="text-center mb-5">
      <h2 class="fw-bold display-6">Contact Us</h2>
      <p class="text-muted fs-6">
        We'd love to hear from you! Get in touch with our team for any inquiries or support.
      </p>
    </div>

    <div class="row g-5 align-items-start">
      <!-- Contact Form -->
      <div class="col-12 col-lg-7">
        <div class="card border-0 shadow-sm rounded-4 p-4">
          <h5 class="fw-semibold mb-4">Send Us a Message</h5>

          <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
            <div class="row g-3">
              <div class="col-md-6">
                <input
                  type="text"
                  class="form-control"
                  placeholder="Your Name"
                  name="name"
                  [(ngModel)]="contact.name"
                  required
                />
              </div>
              <div class="col-md-6">
                <input
                  type="email"
                  class="form-control"
                  placeholder="Your Email"
                  name="email"
                  [(ngModel)]="contact.email"
                  required
                />
              </div>
              <div class="col-12">
                <input
                  type="text"
                  class="form-control"
                  placeholder="Subject"
                  name="subject"
                  [(ngModel)]="contact.subject"
                />
              </div>
              <div class="col-12">
                <textarea
                  class="form-control"
                  rows="5"
                  placeholder="Your Message"
                  name="message"
                  [(ngModel)]="contact.message"
                  required
                ></textarea>
              </div>
              <div class="col-12 text-end">
                <button
                  type="submit"
                  class="btn btn-warning rounded-pill px-4 py-2 fw-semibold"
                  [disabled]="!contactForm.valid"
                >
                  Send Message
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- Contact Info -->
      <div class="col-12 col-lg-5">
        <div class="info-card p-4 rounded-4 shadow-sm bg-white">
          <h5 class="fw-semibold mb-4">Get In Touch</h5>

          <div class="d-flex align-items-start mb-4">
            <i class="bi bi-geo-alt text-warning fs-4 me-3"></i>
            <div>
              <h6 class="fw-semibold mb-1">Address</h6>
              <p class="text-muted mb-0">123 Palm Street, Downtown, Cairo, Egypt</p>
            </div>
          </div>

          <div class="d-flex align-items-start mb-4">
            <i class="bi bi-telephone text-warning fs-4 me-3"></i>
            <div>
              <h6 class="fw-semibold mb-1">Phone</h6>
              <p class="text-muted mb-0">+20 101 645 2088</p>
            </div>
          </div>

          <div class="d-flex align-items-start mb-4">
            <i class="bi bi-envelope text-warning fs-4 me-3"></i>
            <div>
              <h6 class="fw-semibold mb-1">Email</h6>
              <p class="text-muted mb-0">info@luxuryhotel.com</p>
            </div>
          </div>

          <div class="map-wrapper mt-4 rounded-4 overflow-hidden">
            <iframe
              src="https://maps.google.com/maps?q=cairo&t=&z=13&ie=UTF8&iwloc=&output=embed"
              width="100%"
              height="250"
              style="border:0;"
              allowfullscreen=""
              loading="lazy"
            ></iframe>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
