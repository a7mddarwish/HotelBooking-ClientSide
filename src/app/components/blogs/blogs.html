<section class="blogs-section py-5 bg-light">
  <div class="container">
    <div class="text-center mb-5">
      <h2 class="fw-bold display-6">Latest Blogs & News</h2>
      <p class="text-muted fs-6">Stay updated with our latest stories and hotel experiences.</p>
    </div>

    <div class="row g-4">
      <div class="col-12 col-md-6 col-lg-3" *ngFor="let blog of blogs">
        <div class="card blog-card border-0 shadow-sm h-100">
          <div class="img-wrapper">
            <img [src]="blog.imageUrl" [alt]="blog.title" class="card-img-top" />
          </div>
          <div class="card-body d-flex flex-column">
            <h5 class="fw-semibold mb-2">{{ blog.title }}</h5>
            <small class="text-muted mb-2">{{ blog.date }}</small>
            <p class="text-muted small flex-grow-1">{{ blog.summary }}</p>
            <button class="btn btn-outline-warning mt-auto rounded-pill"
                    (click)="openBlog(blog)">
              Read More
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Blog Bubble Modal ===== -->
  <div class="blog-modal" *ngIf="selectedBlog">
    <div class="modal-content shadow-lg">
      <button class="close-btn btn btn-warning btn-sm" (click)="closeBlog()">
        ✕
      </button>

      <img [src]="selectedBlog.imageUrl" class="modal-img mb-3" [alt]="selectedBlog.title" />

      <h3 class="fw-bold mb-2">{{ selectedBlog.title }}</h3>
      <small class="text-muted d-block mb-3">
        By {{ selectedBlog.author }} | {{ selectedBlog.date }}
      </small>

      <p class="text-secondary fs-6 lh-lg mb-0">
        {{ selectedBlog.content }}
      </p>
    </div>
  </div>
</section>
