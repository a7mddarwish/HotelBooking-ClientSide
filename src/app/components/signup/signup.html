<section class="signup-section py-5 bg-light">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <h2 class="fw-bold mb-2">Create Account</h2>
              <p class="text-muted">Join us today</p>
            </div>

            <form (ngSubmit)="onSubmit()">
              <div class="mb-3">
                <label class="form-label fw-semibold">Full Name</label>
                <input 
                  type="text" 
                  [(ngModel)]="fullName" 
                  name="fullName" 
                  class="form-control form-control-lg" 
                  placeholder="Enter your full name"
                  required>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <input 
                  type="email" 
                  [(ngModel)]="email" 
                  name="email" 
                  class="form-control form-control-lg" 
                  placeholder="Enter your email"
                  required>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input 
                  type="password" 
                  [(ngModel)]="password" 
                  name="password" 
                  class="form-control form-control-lg" 
                  placeholder="Create a password"
                  required>
              </div>

              <div class="mb-4">
                <label class="form-label fw-semibold">Confirm Password</label>
                <input 
                  type="password" 
                  [(ngModel)]="confirmPassword" 
                  name="confirmPassword" 
                  class="form-control form-control-lg" 
                  placeholder="Confirm your password"
                  required>
              </div>

              <button type="submit" class="btn btn-warning btn-lg w-100 text-white fw-semibold mb-3">
                Sign Up
              </button>

              <p class="text-center text-muted mb-0">
                Already have an account? 
                <a routerLink="/signin" class="text-warning text-decoration-none fw-semibold">Sign In</a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
