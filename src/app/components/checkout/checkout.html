<section class="checkout-section py-5 bg-light">
  <div class="container">
    <h2 class="fw-bold mb-4 text-center display-6">Checkout</h2>

    <div class="row">
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm mb-4">
          <div class="card-body p-4">
            <h4 class="fw-bold mb-3">Personal Information</h4>
            <form (ngSubmit)="onSubmit()">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-semibold">Full Name</label>
                  <input type="text" [(ngModel)]="fullName" name="fullName" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-semibold">Email</label>
                  <input type="email" [(ngModel)]="email" name="email" class="form-control" required>
                </div>
                <div class="col-md-12 mb-3">
                  <label class="form-label fw-semibold">Phone Number</label>
                  <input type="tel" [(ngModel)]="phone" name="phone" class="form-control" required>
                </div>
              </div>

              <hr class="my-4">

              <h4 class="fw-bold mb-3">Payment Information</h4>
              <div class="row">
                <div class="col-md-12 mb-3">
                  <label class="form-label fw-semibold">Card Number</label>
                  <input type="text" [(ngModel)]="cardNumber" name="cardNumber" class="form-control" placeholder="1234 5678 9012 3456" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-semibold">Expiry Date</label>
                  <input type="text" [(ngModel)]="expiryDate" name="expiryDate" class="form-control" placeholder="MM/YY" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-semibold">CVV</label>
                  <input type="text" [(ngModel)]="cvv" name="cvv" class="form-control" placeholder="123" required>
                </div>
              </div>

              <button type="submit" class="btn btn-warning btn-lg w-100 text-white fw-semibold mt-3">
                Complete Booking
              </button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card border-0 shadow-sm sticky-top" style="top: 100px;">
          <div class="card-body p-4">
            <h4 class="fw-bold mb-3">Booking Summary</h4>
            <div class="mb-3">
              <img src="assets/imgs/DeluxeRoom.jpg" alt="Room" class="img-fluid rounded mb-2">
              <h6 class="fw-semibold">Deluxe Room</h6>
              <p class="text-muted small mb-1">Check-in: Feb 15, 2026</p>
              <p class="text-muted small mb-0">Check-out: Feb 18, 2026</p>
            </div>
            <hr>
            <div class="d-flex justify-content-between mb-2">
              <span>3 Nights × $199</span>
              <span>$597</span>
            </div>
            <div class="d-flex justify-content-between mb-2">
              <span>Tax (10%)</span>
              <span>$59.70</span>
            </div>
            <hr>
            <div class="d-flex justify-content-between">
              <span class="fw-bold">Total</span>
              <span class="fw-bold text-warning">$656.70</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
